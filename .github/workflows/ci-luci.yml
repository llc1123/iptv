name: LuCI

on:
  push:
    branches: ['**']
    paths: ['deploy/openwrt/luci-app-iptv/htdocs/**']
  pull_request:
    paths: ['deploy/openwrt/luci-app-iptv/htdocs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  views:
    name: view syntax and menu wiring
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: LuCI JSON is valid
        run: |
          for f in $(git ls-files 'deploy/openwrt/luci-app-iptv/root/**/*.json'); do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"
          done

      # The views are plain scripts that the LuCI loader wraps in a function,
      # so they are neither ES modules nor runnable files: `node --check` is the
      # parse check that fits them.
      - name: View syntax
        run: |
          for view in $(git ls-files 'deploy/openwrt/luci-app-iptv/htdocs/*.js'); do
            node --check "$view"
          done

      # Every route a view renders must exist in the ACL and menu files, or the
      # page 404s or fails with a permission error on the router.
      - name: Declared routes have ACL and menu entries
        run: |
          node -e '
            const fs = require("fs");
            const base = "deploy/openwrt/luci-app-iptv/root/usr/share";
            const menu = JSON.parse(fs.readFileSync(`${base}/luci/menu.d/luci-app-iptv.json`, "utf8"));
            const acl = JSON.parse(fs.readFileSync(`${base}/rpcd/acl.d/luci-app-iptv.json`, "utf8"));
            const paths = Object.keys(menu.luci).map(k => menu.luci[k].path);
            const expected = ["admin/services/iptv/settings", "admin/services/iptv/status", "admin/services/iptv/log"];
            for (const want of expected) {
              if (!paths.includes(want)) { console.error(`menu is missing ${want}`); process.exit(1); }
            }
            if (!acl["luci-app-iptv"] || !acl["luci-app-iptv"].read) {
              console.error("acl is missing the read grant"); process.exit(1);
            }
            console.log("menu and acl cover the declared routes");
          '
