[project]
name = "iptv"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.1",
    "aiohttp>=3.13.2",
    "httpx2[brotli,http2,zstd]>=2.16.0",
    "pycryptodome>=4.2.0",
    "pydantic>=2.14.2",
    "scapy>=2.8.0",
    "typer>=0.27.3",
]

[project.scripts]
iptv-server = "iptv_client.service_cli:main"
iptv-logo-catalog = "iptv_client.logo_cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "iptv_client"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.94",
]
