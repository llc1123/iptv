[package]
name = "iptv-media-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Rust media server scaffold for the IPTV deployment"

[lib]
path = "src/lib.rs"

[[bin]]
name = "iptv-media-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5.39", features = ["derive", "env"] }
des = "0.9.0"
dhcproto = "0.14.0"
etherparse = "0.21.0"
hex = "0.4.3"
libc = "0.2.191"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
# Golden-fixture tests verify manifest-declared SHA-256 goldens and parse the
# fixture manifest. All three crates are already in the locked dependency
# graph (ring via rustls-webpki, serde/serde_json via axum's json feature), so
# this changes no locked version.
ring = "0.17.14"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unused_must_use = "deny"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
incremental = true
